<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">Škoda Octavia III (2016) – numbered steering wheel controls</title>
<desc id="desc">Illustrated reference for steering wheel button locations and gestures. The two scroll rollers distinguish pressing from rotation. Reference IDs: left 1, 2, 3.1, 3.2, 4, 5; right 6, 7, 8, 9.1, 9.2, 10. Not a universal VAG wheel layout.</desc>
<defs>
<linearGradient id="bezel" x1="0" x2="0.4" y1="0" y2="1"><stop stop-color="#526574"/><stop offset=".17" stop-color="#111e2a"/><stop offset=".78" stop-color="#070c13"/><stop offset=".94" stop-color="#798a95"/><stop offset="1" stop-color="#172734"/></linearGradient>
<linearGradient id="btn" x1="0" x2=".7" y1="0" y2="1"><stop stop-color="#455363"/><stop offset=".3" stop-color="#283441"/><stop offset="1" stop-color="#141c27"/></linearGradient>
<linearGradient id="roller" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#54616c"/><stop offset=".23" stop-color="#101923"/><stop offset=".75" stop-color="#303a45"/><stop offset="1" stop-color="#101721"/></linearGradient>
<pattern id="knurl" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 2L7 9M5 0L9 4M1 9L9 1" stroke="#8f9da4" stroke-width="1.4" opacity=".42"/></pattern>
<style>
.title{font:700 33px Arial,sans-serif;fill:#fff}.section{font:700 25px Arial,sans-serif;fill:#102438}
.num{font:700 24px Arial,sans-serif;fill:white}.key{font:700 47px Arial,sans-serif;fill:#eff6f9}
.small{font:700 34px Arial,sans-serif;fill:#eff6f9}
</style>
</defs>
